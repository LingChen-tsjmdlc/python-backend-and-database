<rect x="40" y="344" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="340" y="364" text-anchor="middle" font-size="13" fill="#2C2C2A">contacts[0]["phone"]：先取第 0 个字典，再按 "phone" 键取值 → "13800000001"</text>
<text x="340" y="382" text-anchor="middle" font-size="11" fill="#5F5E5A">列表管"顺序"，字典管"字段名"——嵌套结构就是这样一层层搭起来的</text>
