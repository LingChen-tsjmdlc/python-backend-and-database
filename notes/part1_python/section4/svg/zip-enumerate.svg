<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<text x="340" y="38" text-anchor="middle" font-size="22" fill="#2C2C2A">遍历的两个好帮手：zip 与 enumerate</text>

<text x="60" y="76" font-size="14" font-weight="500" fill="#2C2C2A">zip(names, scores)：按位置配成对</text>
<text x="60" y="127" font-size="12" fill="#5F5E5A">names</text>
<rect x="140" y="104" width="64" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="172" y="127" text-anchor="middle" font-size="13" fill="#2C2C2A">小明</text>
<rect x="224" y="104" width="64" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="256" y="127" text-anchor="middle" font-size="13" fill="#2C2C2A">小红</text>
<rect x="308" y="104" width="64" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="127" text-anchor="middle" font-size="13" fill="#2C2C2A">小刚</text>

<text x="60" y="193" font-size="12" fill="#5F5E5A">scores</text>
<rect x="140" y="170" width="64" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="172" y="193" text-anchor="middle" font-size="13" fill="#2C2C2A">85</text>
<rect x="224" y="170" width="64" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="256" y="193" text-anchor="middle" font-size="13" fill="#2C2C2A">92</text>
<rect x="308" y="170" width="64" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="193" text-anchor="middle" font-size="13" fill="#2C2C2A">78</text>

<path d="M 172 142 L 172 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<path d="M 256 142 L 256 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<path d="M 340 142 L 340 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>

<text x="430" y="120" font-size="12" fill="#5F5E5A">每循环一次取出一对：</text>
<text x="430" y="146" font-size="12" fill="#2C2C2A">小明：85 分</text>
<text x="430" y="170" font-size="12" fill="#2C2C2A">小红：92 分</text>
<text x="430" y="194" font-size="12" fill="#2C2C2A">小刚：78 分</text>

<path d="M 60 226 L 620 226" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="5 4"/>

<text x="60" y="258" font-size="14" font-weight="500" fill="#2C2C2A">enumerate(scores)：连序号一起给</text>
<circle cx="172" cy="286" r="11" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="172" y="290" text-anchor="middle" font-size="12" fill="#854F0B">0</text>
<circle cx="256" cy="286" r="11" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="256" y="290" text-anchor="middle" font-size="12" fill="#854F0B">1</text>
<circle cx="340" cy="286" r="11" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" font-size="12" fill="#854F0B">2</text>
<path d="M 172 298 L 172 312" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<path d="M 256 298 L 256 312" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<path d="M 340 298 L 340 312" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="140" y="316" width="64" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="172" y="339" text-anchor="middle" font-size="13" fill="#2C2C2A">85</text>
<rect x="224" y="316" width="64" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="256" y="339" text-anchor="middle" font-size="13" fill="#2C2C2A">92</text>
<rect x="308" y="316" width="64" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="339" text-anchor="middle" font-size="13" fill="#2C2C2A">78</text>
<text x="172" y="376" text-anchor="middle" font-size="12" fill="#5F5E5A">(0, 85)</text>
<text x="256" y="376" text-anchor="middle" font-size="12" fill="#5F5E5A">(1, 92)</text>
<text x="340" y="376" text-anchor="middle" font-size="12" fill="#5F5E5A">(2, 78)</text>
<text x="430" y="310" font-size="12" fill="#5F5E5A">for i, s in enumerate(scores):</text>
<text x="430" y="334" font-size="12" fill="#5F5E5A">i 接序号，s 接元素</text>
</svg>
