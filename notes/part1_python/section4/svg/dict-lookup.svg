<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="680" height="310" fill="#FFFFFF"/>
<text x="340" y="40" text-anchor="middle" font-size="22" fill="#2C2C2A">列表按位置找，字典按名字找</text>

<rect x="40" y="64" width="290" height="196" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="185" y="94" text-anchor="middle" font-size="15" font-weight="500" fill="#185FA5">列表 scores</text>
<rect x="66" y="112" width="64" height="38" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="98" y="136" text-anchor="middle" font-size="14" fill="#2C2C2A">85</text>
<rect x="144" y="112" width="64" height="38" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
<text x="176" y="136" text-anchor="middle" font-size="14" fill="#2C2C2A">92</text>
<rect x="222" y="112" width="64" height="38" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="254" y="136" text-anchor="middle" font-size="14" fill="#2C2C2A">78</text>
<text x="98" y="172" text-anchor="middle" font-size="12" fill="#1D9E75">0</text>
<text x="176" y="172" text-anchor="middle" font-size="12" fill="#BA7517">1</text>
<text x="254" y="172" text-anchor="middle" font-size="12" fill="#1D9E75">2</text>
<text x="185" y="216" text-anchor="middle" font-size="13" fill="#2C2C2A">scores[1] → 92</text>
<text x="185" y="240" text-anchor="middle" font-size="12" fill="#5F5E5A">靠索引（第几个）找</text>

<rect x="350" y="64" width="290" height="196" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="495" y="94" text-anchor="middle" font-size="15" font-weight="500" fill="#0F6E56">字典 student</text>
<rect x="370" y="110" width="58" height="28" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="399" y="128" text-anchor="middle" font-size="11" fill="#854F0B">"name"</text>
<path d="M 432 124 L 456 124" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="458" y="110" width="120" height="28" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="518" y="128" text-anchor="middle" font-size="12" fill="#2C2C2A">小明</text>
<rect x="370" y="148" width="58" height="28" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
<text x="399" y="166" text-anchor="middle" font-size="11" fill="#854F0B">"age"</text>
<path d="M 432 162 L 456 162" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="458" y="148" width="120" height="28" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
<text x="518" y="166" text-anchor="middle" font-size="12" fill="#2C2C2A">18</text>
<rect x="370" y="186" width="58" height="28" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="399" y="204" text-anchor="middle" font-size="11" fill="#854F0B">"city"</text>
<path d="M 432 200 L 456 200" fill="none" stroke="#888780" stroke-width="1.2"/>
<rect x="458" y="186" width="120" height="28" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="518" y="204" text-anchor="middle" font-size="12" fill="#2C2C2A">深圳</text>
<text x="495" y="240" text-anchor="middle" font-size="13" fill="#2C2C2A">student["age"] → 18</text>

<text x="340" y="292" text-anchor="middle" font-size="12" fill="#5F5E5A">字典不关心"第几个"，只关心"叫什么名字"</text>
</svg>
