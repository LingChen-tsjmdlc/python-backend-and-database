<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="470" fill="#FFFFFF"/>
<text x="340" y="38" text-anchor="middle" font-size="22" fill="#2C2C2A">选容器：两个判断定形状，真实数据靠组合</text>

<rect x="190" y="58" width="300" height="44" rx="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="85" text-anchor="middle" font-size="14" fill="#2C2C2A">要装的是"一组东西"吗？</text>

<path d="M 250 102 C 210 116, 185 122, 170 134" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="192" y="116" font-size="11" fill="#1D9E75">是</text>
<path d="M 430 102 C 470 116, 495 122, 510 134" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="480" y="116" font-size="11" fill="#888780">否（就一样）</text>

<rect x="50" y="138" width="240" height="44" rx="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="170" y="165" text-anchor="middle" font-size="13" fill="#2C2C2A">要顺序、会增删改吗？</text>
<rect x="390" y="138" width="240" height="44" rx="22" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="510" y="165" text-anchor="middle" font-size="13" fill="#2C2C2A">数据有"字段名"吗？</text>

<path d="M 120 182 C 105 196, 100 204, 97 214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="96" y="200" font-size="11" fill="#1D9E75">是</text>
<path d="M 220 182 C 235 196, 240 204, 243 214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="232" y="200" font-size="11" fill="#888780">否（只要去重）</text>
<path d="M 460 182 C 445 196, 440 204, 437 214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="436" y="200" font-size="11" fill="#1D9E75">有</text>
<path d="M 560 182 C 575 196, 580 204, 583 214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="572" y="200" font-size="11" fill="#888780">没有（固定几个）</text>

<rect x="40" y="218" width="115" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="97" y="239" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">列表 list</text>
<text x="97" y="256" text-anchor="middle" font-size="10" fill="#5F5E5A">有序、可增删改</text>
<rect x="185" y="218" width="115" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="242" y="239" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">集合 set</text>
<text x="242" y="256" text-anchor="middle" font-size="10" fill="#5F5E5A">去重、查在不在</text>
<rect x="380" y="218" width="115" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="437" y="239" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">字典 dict</text>
<text x="437" y="256" text-anchor="middle" font-size="10" fill="#5F5E5A">键 → 值</text>
<rect x="525" y="218" width="115" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="582" y="239" text-anchor="middle" font-size="14" font-weight="500" fill="#0F6E56">元组 tuple</text>
<text x="582" y="256" text-anchor="middle" font-size="10" fill="#5F5E5A">固定、防误改</text>

<path d="M 40 296 L 640 296" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="340" y="322" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">真实数据大多是组合</text>

<rect x="40" y="340" width="190" height="96" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="135" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#854F0B">列表 装 字典</text>
<text x="135" y="388" text-anchor="middle" font-size="11" fill="#5F5E5A">一串带字段的记录</text>
<text x="135" y="408" text-anchor="middle" font-size="11" fill="#5F5E5A">students[1]["name"]</text>

<rect x="245" y="340" width="190" height="96" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="340" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#854F0B">字典 装 列表</text>
<text x="340" y="388" text-anchor="middle" font-size="11" fill="#5F5E5A">把一组东西分类放</text>
<text x="340" y="408" text-anchor="middle" font-size="11" fill="#5F5E5A">groups["一班"][0]</text>

<rect x="450" y="340" width="190" height="96" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="545" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#854F0B">list(set(...))</text>
<text x="545" y="388" text-anchor="middle" font-size="11" fill="#5F5E5A">集合去重，转回列表用</text>
<text x="545" y="408" text-anchor="middle" font-size="11" fill="#5F5E5A">unique = list(set(nums))</text>
</svg>
